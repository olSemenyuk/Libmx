name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: clang }
          - { os: ubuntu-latest, cc: gcc }
          - { os: macos-latest, cc: clang }

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        run: make CC=${{ matrix.cc }}

      - name: Test (ASan + UBSan)
        run: make test CC=${{ matrix.cc }}
        env:
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && 'detect_leaks=1' || '' }}